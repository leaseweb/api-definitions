get:
  description: >
    Returns one dedicated server configuration with its configuration options
    and its price at the requested location.


    The price is calculated for the contract term and billing cycle you ask for,
    defaulting to a monthly contract billed monthly, and is expressed in the
    currency of the sales organization your API key belongs to. `price.details`
    breaks it down by category, exactly as it is composed on the SAP side, so
    the categories present depend on what the server is made of.


    `configurationOptions` lists the operating systems, service level
    agreements, data packs, uplink port speeds, private network ports and IPv4
    options the server can be ordered with, each with its monthly price on top
    of the server price. Pass the matching query parameters to price the server
    with them; anything you leave out keeps the server default, marked
    `selected` in the list:


    - `serviceLevelAgreement`, which defaults to Basic.

    - `dataPackType`, `dataPackBilling` and `dataPackQuantity` together choose a
    data pack, which replaces the default one. `dataPackQuantity` is required
    and must be one of the quantities listed for that type and billing.

    - `uplinkPortSpeed` and `privateNetwork`, by the name listed for them.

    - `ipv4Quantity` for up to 1000 individual IPv4 addresses, or `ipv4Subnet`
    with the prefix length of one of the listed subnets. The two cannot be
    combined; sending both is refused with a 400.


    An option the server does not offer, or a combination of options it cannot
    be delivered with, is refused with a 400.


    `stock` reports how many of this configuration are in stock at that
    location.
  operationId: getDedicatedServer
  parameters:
    - in: query
      name: location
      required: true
      schema:
        description: >-
          The datacenter location. Must belong to the sales organization the API
          key is issued for.
        example: AMS-01
        type: string
    - in: query
      name: contractTerm
      schema:
        default: 1_MONTH
        description: Order contract term
        example: 1_YEAR
        type: string
        enum:
          - 1_MONTH
          - 3_MONTHS
          - 6_MONTHS
          - 1_YEAR
          - 2_YEARS
          - 3_YEARS
    - in: query
      name: billingCycle
      schema:
        default: 1_MONTH
        description: Billing cycle period
        example: 3_MONTHS
        type: string
        enum:
          - 1_MONTH
          - 3_MONTHS
          - 6_MONTHS
          - 1_YEAR
          - 2_YEARS
          - 3_YEARS
    - in: query
      name: connectedToAggregationPool
      schema:
        default: 'false'
        description: To add the dedicated server in the connectivity aggregation pool
        example: 'true'
        type: boolean
    - in: query
      name: serviceLevelAgreement
      schema:
        default: BASIC
        description: >-
          Service level agreement. Must be one of the options the detail
          endpoint lists for the server.
        example: GOLD
        type: string
        enum:
          - BASIC
          - BRONZE
          - SILVER
          - GOLD
          - PLATINUM
    - in: query
      name: dataPackType
      schema:
        description: >-
          Network type of the data pack. Choosing a data pack replaces the
          default one the server comes with, so `dataPackQuantity` is required
          with it. When a data pack is chosen without it, `VOLUME` is used.
        example: PREMIUM
        type: string
        enum:
          - VOLUME
          - PREMIUM
    - in: query
      name: dataPackBilling
      schema:
        description: >-
          How the data pack is billed: `DATA_TRAFFIC` is a monthly traffic
          commit in TB, `UNMETERED` a flat fee bandwidth in Mbps and `METERED` a
          bandwidth commit in Mbps. `dataPackQuantity` is required with it. When
          a data pack is chosen without it, `DATA_TRAFFIC` is used.
        example: DATA_TRAFFIC
        type: string
        enum:
          - DATA_TRAFFIC
          - UNMETERED
          - METERED
    - in: query
      name: dataPackQuantity
      schema:
        description: >-
          Size of the data pack, in TB for `DATA_TRAFFIC` and in Mbps for
          `UNMETERED` and `METERED`. Must be one of the quantities the detail
          endpoint lists in `configurationOptions.dataPack` for the chosen type
          and billing; any other is refused with a 400. When no data pack field
          is passed, the server keeps its default data pack.
        example: 10
        type: integer
        minimum: 1
    - in: query
      name: uplinkPortSpeed
      schema:
        description: >-
          Uplink port speed, by its name as the detail endpoint lists it in
          `configurationOptions.uplinkPortSpeed`. An option the server does not
          offer is refused with a 400.
        example: 1 x 10.000 Mbps UTP
        type: string
    - in: query
      name: privateNetwork
      schema:
        description: >-
          Private network port, by its name as the detail endpoint lists it in
          `configurationOptions.privateNetwork`. An option the server does not
          offer is refused with a 400.
        example: 1000Mbps port
        type: string
    - in: query
      name: ipv4Type
      schema:
        description: >-
          Whether the server gets individual IPv4 addresses or an IPv4 subnet.
          It follows from the other IPv4 field when omitted: `SUBNET` when
          `ipv4Subnet` is passed, `INDIVIDUAL` otherwise. `SUBNET` requires
          `ipv4Subnet` and `INDIVIDUAL` refuses it.
        example: SUBNET
        type: string
        enum:
          - INDIVIDUAL
          - SUBNET
    - in: query
      name: ipv4Quantity
      schema:
        description: >-
          Number of individual IPv4 addresses. Cannot be combined with
          `ipv4Subnet`. When no IPv4 field is passed, the server gets one
          individual address.
        example: 4
        type: integer
        minimum: 1
        maximum: 1000
    - in: query
      name: ipv4Subnet
      schema:
        description: >-
          Prefix length of the IPv4 subnet, e.g. 29 for a /29. Must be one of
          the subnets the detail endpoint lists in
          `configurationOptions.ipv4.subnet`. Cannot be combined with
          `ipv4Quantity`.
        example: 29
        type: integer
        minimum: 16
        maximum: 31
  responses:
