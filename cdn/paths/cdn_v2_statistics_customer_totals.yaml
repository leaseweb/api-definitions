get:
  description: >
    Get the statistics totals of your distributions.


    Refer to the "Get statistics" endpoint for a description of the available
    metrics.
  operationId: getStatisticsTotals
  parameters:
    - $ref: ../components/parameters/fromDt.yaml
    - $ref: ../components/parameters/toDt.yaml
    - $ref: ../components/parameters/metric.yaml
    - $ref: ../components/parameters/_parameters_distributionId.yaml
    - $ref: ../components/parameters/groupBy.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/getStatisticsTotalsResult.yaml
          example:
            distributionId: null
            fromTs: '2024-07-13T14:45:00'
            granularity: 5m
            groupBy: provider
            series:
              - edgio:
                  - total: 237047731.04000002
              - gcore:
                  - total: 29610955.653333336
            service: cdn
            toTs: '2024-07-13T14:55:00'
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
  summary: Get statistics totals
  tags:
    - CDN
  x-codeSamples:
