get:
  description: |
    Get the statistics of your distributions.

    Metrics allowed:

    - DATATRANSFER: consumed amount of traffic (in bytes)
    - BANDWIDTH: mean amount of bits per second
    - REQUESTS: total amount of serviced requests
    - STATUS_2XX/4XX/5XX: percentage of the amount of response codes
    - CACHEHIT: mean cache-hit ratio
    - 95TH: 95th percentile in bits per second
  operationId: getStatistics
  parameters:
    - $ref: ../components/parameters/fromDt.yaml
    - $ref: ../components/parameters/toDt.yaml
    - $ref: ../components/parameters/metric.yaml
    - $ref: ../components/parameters/_parameters_distributionId.yaml
    - $ref: ../components/parameters/groupBy.yaml
    - $ref: ../components/parameters/granularity.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/getStatisticsResult.yaml
          example:
            distributionId: null
            fromTs: '2024-08-20T09:28:38'
            granularity: 5m
            groupBy: region
            series:
              - apac:
                  - '2024-08-20T09:30:00Z': 183825403.06666666
                  - '2024-08-20T09:35:00Z': 185589722.85333332
                  - '2024-08-20T09:40:00Z': 197508437.41333333
                asia:
                  - '2024-08-20T09:30:00Z': 271617.8933333333
                  - '2024-08-20T09:35:00Z': 43990.05333333334
                  - '2024-08-20T09:40:00Z': 164099.75999999998
                eu:
                  - '2024-08-20T09:30:00Z': 123709458.08
                  - '2024-08-20T09:35:00Z': 75186491.28
                  - '2024-08-20T09:40:00Z': 56450983.413333334
            service: cdn
            toTs: '2024-08-20T09:40:00'
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '500':
