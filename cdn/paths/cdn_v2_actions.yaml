get:
  description: |
    List all the actions to monitor their progress.
  operationId: getActions
  parameters:
    - name: filters
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - INVALIDATION
            - CREATE_DIST
            - UPDATE_DIST
            - DELETE_DIST
            - SAVE_SHIELD
            - DELETE_SHIELD
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/offset.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/getActionsResult.yaml
          example:
            _metadata:
              totalCount: 2
              limit: 10
              offset: 0
            actions:
              - type: CREATE_DIST
                resource:
                  info_hidden: info_hidden
                status: FINISHED
                id: dac57900-0109-4615-b808-003f2c07cb40
                customerId: '59841258'
                salesOrgId: '2000'
                created: '2024-07-10T13:10:15Z'
                updated: '2024-08-08T12:52:09Z'
                correlationId: null
              - type: UPDATE_DIST
                resource:
                  info_hidden: info_hidden
                status: FINISHED
                id: 755ad32d-264d-4ace-bd4c-c30399c71675
                customerId: '59841258'
                salesOrgId: '2000'
                created: '2024-07-10T13:11:13Z'
                updated: '2024-08-08T12:52:09Z'
                correlationId: null
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
  summary: List actions
  tags:
    - CDN
  x-codeSamples:
    - lang: Shell + Curl
      source:
        $ref: ../code_samples/Shell+Curl/cdn_v2_actions/getundefined
    - lang: Python + Python3
      source:
        $ref: ../code_samples/Python+Python3/cdn_v2_actions/getundefined
    - lang: Php + Http2
      source:
        $ref: ../code_samples/Php+Http2/cdn_v2_actions/getundefined
    - lang: Javascript + Jquery
      source:
        $ref: ../code_samples/Javascript+Jquery/cdn_v2_actions/getundefined
    - lang: Go + Native
      source:
        $ref: ../code_samples/Go+Native/cdn_v2_actions/getundefined
