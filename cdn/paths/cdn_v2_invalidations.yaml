post:
  description: >
    Send URLs to be invalidated.


    More information can be found in the [Knowledge
    Base](https://kb.leaseweb.com/kb/multi-cdn/multi-cdn-invalidations/)
  operationId: doInvalidation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/doInvalidationOpts.yaml
        example:
          files:
            - https://cdn-assets.leaseweb.com/styles.css
  responses:
    '201':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/doInvalidationResult.yaml
          example:
            correlationId: null
            created: '2024-07-11T12:14:43Z'
            customerId: '47927462'
            id: 0533396e-e5c6-4de2-bd08-06dfa91a3ab6
            resource:
              invalidations:
                - distributionId: di-yt84vrj
                  url: https://cdn-assets.leaseweb.com/styles.css
                  responses: null
                  status: PENDING
                  errorMessage: null
                  providers:
                    - edgeio
                    - gcore
            salesOrgId: '2000'
            status: PENDING
            type: INVALIDATION
            updated: null
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
  summary: Do invalidation
  tags:
    - CDN
  x-codeSamples:
    - lang: Shell + Curl
      source:
        $ref: ../code_samples/Shell+Curl/cdn_v2_invalidations/postundefined
    - lang: Python + Python3
      source:
        $ref: ../code_samples/Python+Python3/cdn_v2_invalidations/postundefined
    - lang: Php + Http2
      source:
        $ref: ../code_samples/Php+Http2/cdn_v2_invalidations/postundefined
    - lang: Javascript + Jquery
      source:
        $ref: ../code_samples/Javascript+Jquery/cdn_v2_invalidations/postundefined
    - lang: Go + Native
      source:
        $ref: ../code_samples/Go+Native/cdn_v2_invalidations/postundefined
