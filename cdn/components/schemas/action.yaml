properties:
  type:
    type: string
    enum:
      - INVALIDATION
      - CREATE_DIST
      - UPDATE_DIST
      - DELETE_DIST
      - SAVE_SHIELD
      - DELETE_SHIELD
  status:
    type: string
    enum:
      - PENDING
      - IN_PROGRESS
      - FINISHED
      - ERROR
  id:
    type: string
  customerId:
    type: string
  salesOrgId:
    type: string
  created:
    type: string
    format: date-time
  updated:
    type:
      - string
      - 'null'
    format: date-time
  resource:
    title: resource
    type: object
    additionalProperties: true
  correlationId:
    type:
      - string
      - 'null'
required:
  - type
  - status
  - id
  - customerId
  - salesOrgId
  - created
  - updated
  - resource
  - correlationId
type: object
