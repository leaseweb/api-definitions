properties:
  description:
    type:
      - string
      - 'null'
  certificate:
    type: string
    description: hidden for security reason
  privateKey:
    type: string
    description: hidden for security reason
  caBundle:
    type: string
    description: hidden for security reason
  id:
    type: string
  customerId:
    type: string
  salesOrgId:
    type: string
  commonName:
    type:
      - string
      - 'null'
  issuer:
    type:
      - string
      - 'null'
  valid:
    type: boolean
    description: whether the certificate is expired or not
  trusted:
    type: boolean
    description: whether the private key and CA bundle match the certificate
  daysLeft:
    type: integer
    description: number of days left until certificate expiration
  validFrom:
    type: number
    description: start of certificate valid period
    format: timestamp
  validUntil:
    type: number
    description: end of certificate valid period
    format: timestamp
  created:
    type: string
    format: date-time
  updated:
    type:
      - string
      - 'null'
    format: date-time
required:
  - description
  - certificate
  - privateKey
  - caBundle
  - id
  - customerId
  - salesOrgId
  - commonName
  - issuer
  - valid
  - trusted
  - daysLeft
  - validFrom
  - validUntil
  - created
  - updated
type: object
