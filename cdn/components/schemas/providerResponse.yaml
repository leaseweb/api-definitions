properties:
  providerType:
    type: string
    description: Name of the provider
  success:
    type: boolean
    description: True if the request is considered successful (status code is 2XX or 3XX)
  ip:
    type:
      - string
      - 'null'
  statusCode:
    type:
      - integer
      - 'null'
  message:
    type:
      - string
      - 'null'
    description: error message in case of unsuccessful request
  headers:
    type:
      - array
      - 'null'
    items:
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value
      type: object
required:
  - providerType
  - success
  - ip
  - statusCode
  - message
  - headers
type: object
