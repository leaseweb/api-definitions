get:
  description: Get a specific attachment of a ticket
  operationId: getTicketAttachment
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/getTicketAttachmentResult.yaml
          example: (binary content omitted)
      description: Ok.
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
