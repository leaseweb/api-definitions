type: object
properties:
  id:
    type: string
    description: The unique id of the ticket
  createdAt:
    type: string
    format: date-time
    description: Creation date of the ticket (UTC)
    example: '2019-05-01T00:00:00+00:00'
  createdBy:
    type: string
    description: The user who created the ticket
  status:
    type: string
    description: The status of the ticket
    enum:
      - NEW
      - IN_PROGRESS
      - CLOSED
      - COMPLETED
      - CUSTOMER_INPUT_REQUIRED
      - SCHEDULED
      - RESOLVED
  subject:
    type: string
    description: The subject of the ticket
  updatedAt:
    type: string
    format: date-time
    description: Latest update of the ticket (UTC)
  equipments:
    type: object
    title: equipment
    description: >-
      The equipment of a server attached to the ticket. Always represents a
      single equipment.
    properties:
      equipmentId:
        type: string
        description: The unique id of the equipment
  messages:
    type: array
    description: Array of messages
    items:
      type: object
      title: listOfMessages
      properties:
        messageId:
          type: string
          description: the unique id of the message
        body:
          type: string
          description: the body of the message (closest we can get to plain text)
          example: |-
            Dear support,

            We see that port 49 of our rack switch 1 is down
        date:
          type: string
          format: date-time
          description: The date when the message is created (UTC)
        createdBy:
          type: string
          description: >
            Indicates who wrote the message. `Customer` means the message was
            sent by the customer. `Leaseweb` means the message was sent by a
            Leaseweb support agent.
          enum:
            - Customer
            - Leaseweb
        attachments:
          type: array
          description: Array of attachments
          items:
            type: object
            title: attachment
            properties:
              id:
                type: string
                description: The unique id of an attachment
              name:
                type: string
                description: The name of the attachment
              mimeType:
                type: string
                description: The mimeType of the attachment
              bytes:
                type: string
                description: The size (in bytes) of the attachment
              disposition:
                type: string
                description: >
                  Indicates how the attachment is associated with the message.
                  `standalone` means the file is a separate attachment. `inline`
                  means the file is embedded within the message body.
                enum:
                  - standalone
                  - inline
