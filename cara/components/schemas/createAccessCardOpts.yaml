properties:
  email:
    type: string
    pattern: '[^\s@]+@[^\s@]+\.[^\s@]'
    description: Customer Email
  hasUser:
    type: boolean
    description: Whether or not this user should be allowed to log in to Customer Portal.
  firstName:
    type: string
    description: First Name
  lastName:
    type: string
    description: Last Name
  phoneNumber:
    type: string
    description: Phone Number
    nullable: false
  multipleAccess:
    type: boolean
    description: Whether or not this user can bring visitors
  allowedItems:
    type: array
    description: Allowed equipments
    items:
      type: string
  allItemsAllowed:
    type: boolean
    deprecated: true
    description: >-
      Deprecated, kept for compatibility. Use `allowedItems` instead. If set to
      true, `allowedItems` is automatically filled with all available colocation
      IDs, replacing any value passed in `allowedItems`.
  hasPermanentBadge:
    type: boolean
    description: If true then a permanent badge will be requested for this user
required:
  - email
  - firstName
  - lastName
  - multipleAccess
  - hasUser
type: object
